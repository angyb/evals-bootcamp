# .github/workflows/evals.yml
# Week 4 · regression gate on every prompt change.
#
# Runs only when prompt or eval files change, so it does not tax every PR.

name: eval regression gate

on:
  pull_request:
    paths:
      - 'prompts/**'
      - 'regression_gates/**'
      - '.github/workflows/evals.yml'

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Judges are non-deterministic. Caching keeps repeat runs on an
      # unchanged PR from re-billing and re-rolling the dice.
      - name: Cache promptfoo
        uses: actions/cache@v4
        with:
          path: ~/.promptfoo/cache
          key: promptfoo-${{ hashFiles('regression_gates/promptfooconfig.yaml') }}

      - name: Run regression set
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          npx promptfoo@latest eval \
            --config regression_gates/promptfooconfig.yaml \
            --output results.json \
            --no-progress-bar

      - name: Comment results on the PR
        if: always()
        run: npx promptfoo@latest share --yes || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: results.json

# ── Override protocol ────────────────────────────────────────────────
# This gate is required on main. To merge past a red run:
#
#   1. Comment on the PR with WHY the failure is acceptable. Not "flaky".
#      Name the row and say what you believe is actually true.
#   2. Get a second reviewer to agree in writing, on the PR.
#   3. Apply the `eval-override` label. The label is logged.
#   4. Open a follow-up issue the same day, tagged `eval-debt`.
#
# Review the `eval-override` label monthly. If a row is overridden twice,
# the row is wrong or the gate is wrong. Fix one of them. An override
# path that nobody audits becomes the default path within a quarter.
